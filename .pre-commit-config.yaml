repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff (format)
        entry: uv run ruff format quantbox/ tests/
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: ruff-lint
        name: ruff (lint)
        entry: uv run ruff check quantbox/ --fix
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: mypy
        name: mypy (type check)
        entry: uv run mypy
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: pytest-fast
        name: pytest (fast)
        entry: uv run pytest tests/ -m "not slow" -q --tb=short --timeout=30
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: research-param-guard
        name: research param guard
        entry: uv run python scripts/check_research_params.py
        language: system
        files: ^research/.*\.py$
        pass_filenames: true
        stages: [pre-commit]
