repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff (format)
        entry: uv run ruff format quantbox/ tests/
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: ruff-lint
        name: ruff (lint)
        entry: uv run ruff check quantbox/ --fix
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: pytest-fast
        name: pytest (fast)
        entry: uv run pytest tests/ -m "not slow" -q --tb=short --timeout=30
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
