[project]
name = "trading-code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=46.0.1",
    "discord.py>=2.0",
    "matplotlib>=3.10.6",
    "numba>=0.62.0",
    "pandas>=2.3.2",
    "plotly>=6.5.2",
    "pydantic-settings>=2.12.0",
    "python-binance>=1.0.29",
    "python-dotenv>=1.0.0",
    "requests>=2.32.5",
    "statsmodels>=0.14.5",
    "streamlit>=1.54.0",
    "ta>=0.11.0",
    "tqdm>=4.67.1",
]

[tool.setuptools.packages.find]
include = ["quantbox*"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests that run full backtests with real data (deselect with '-m \"not slow\"')",
]
addopts = "-m 'not slow'"
asyncio_mode = "strict"
timeout = 30

[tool.coverage.run]
source = ["quantbox"]
omit = [
    "quantbox/strategy/rubberband/*",  # legacy, non-production
    "quantbox/strategy/elliott.py",    # legacy, non-production
    "quantbox/strategy/alpha_engine.py",
]

[tool.coverage.report]
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E701",   # multiple statements on one line (intentional in hot paths)
    "E731",   # lambda assignment (intentional)
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]   # re-exports are intentional

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = false
follow_imports = "skip"
# Scope: SSoT config files + pure utility modules.
# Mixin files (brackets, positions, reconciliation, loop_mixin, data_mixin, commands)
# use self.attr from other mixins → Protocol pattern needed before adding here.
files = [
    "quantbox/strategy/vol_straddle/config.py",
    "quantbox/strategy/rubberband/config.py",
    "quantbox/core/bot_utils.py",
    "quantbox/core/scalper_state.py",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.5",
]
