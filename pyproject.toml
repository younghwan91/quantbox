[project]
name = "trading-code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=46.0.1",
    "discord.py>=2.0",
    "matplotlib>=3.10.6",
    "numba>=0.62.0",
    "pandas>=2.3.2",
    "plotly>=6.5.2",
    "pydantic-settings>=2.12.0",
    "python-binance>=1.0.29",
    "python-dotenv>=1.0.0",
    "requests>=2.32.5",
    "statsmodels>=0.14.5",
    "streamlit>=1.54.0",
    "ta>=0.11.0",
    "tqdm>=4.67.1",
]

[tool.setuptools.packages.find]
include = ["quantbox*"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests that run full backtests with real data (deselect with '-m \"not slow\"')",
]
addopts = "-m 'not slow'"
asyncio_mode = "strict"
timeout = 30

[tool.coverage.run]
source = ["quantbox"]
omit = [
    "quantbox/strategy/rubberband/*",  # legacy, non-production
    "quantbox/strategy/elliott.py",    # legacy, non-production
    "quantbox/strategy/alpha_engine.py",
    # signals.py uses Numba @jit(nopython=True) — JIT-compiled code is not
    # trackable by coverage.py. Logic is verified by tests/test_signals_unit.py.
    "quantbox/strategy/vol_straddle/signals.py",
    # types.py contains only NewType/TypedDict definitions — no executable logic.
    "quantbox/core/types.py",
]

[tool.coverage.report]
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E701",   # multiple statements on one line (intentional in hot paths)
    "E731",   # lambda assignment (intentional)
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]   # re-exports are intentional

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = false
follow_imports = "skip"
files = [
    # Core types & protocol (strict)
    "quantbox/core/types.py",
    "quantbox/core/protocol.py",
    # SSoT config files
    "quantbox/strategy/vol_straddle/config.py",
    "quantbox/strategy/rubberband/config.py",
    # Utility modules
    "quantbox/core/bot_utils.py",
    "quantbox/core/scalper_state.py",
    "quantbox/core/events.py",
    "quantbox/core/limit_chaser.py",
    # Execution layer (Protocol pattern applied)
    "quantbox/execution/preflight.py",
    "quantbox/execution/positions.py",
    "quantbox/execution/reconciliation.py",
    "quantbox/execution/brackets.py",
    "quantbox/execution/data_mixin.py",
    # Mixin modules (Protocol pattern applied)
    "quantbox/core/loop_mixin.py",
    "quantbox/core/commands.py",
    # Main entry point
    "quantbox/scalper.py",
    # Data layer
    "quantbox/data/cache.py",
    "quantbox/data/downloader.py",
    "quantbox/data/real_data_loader.py",
]

[[tool.mypy.overrides]]
module = ["quantbox.core.types", "quantbox.core.protocol", "quantbox.execution.preflight"]
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
# RubberBandScalper inherits Mixin methods annotated with self: ScalperProtocol.
# mypy cannot verify structural conformance with follow_imports="skip", so it
# raises [misc] "Invalid self argument" on every Mixin method call from the
# concrete class. This is a known mypy limitation with the Protocol+Mixin pattern.
# The Protocol enforcement still applies within each Mixin file.
module = "quantbox.scalper"
disable_error_code = ["misc", "arg-type"]

[dependency-groups]
dev = [
    "hypothesis>=6.0.0",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.5",
]
