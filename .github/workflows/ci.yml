name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests with coverage
        # 자격증명 자리표시자는 tests/conftest.py가 주입한다 — 훅·CI·수동 실행이
        # 같은 조건이 되도록 한 곳에만 둔다. 여기 env를 되살리면 또 갈라진다.
        run: uv run pytest tests/ -m "not slow" -q --tb=short --cov=quantbox --cov-report=term-missing --cov-fail-under=75

      - name: Ruff format check
        run: uv run ruff format --check quantbox/ tests/

      - name: Ruff lint
        run: uv run ruff check quantbox/

      - name: Mypy type check (SSoT config files)
        run: uv run mypy
