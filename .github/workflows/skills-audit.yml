name: Skills Audit

on:
  schedule:
    - cron: '0 9 1 * *'   # Monthly: 1st of each month at 09:00 UTC
  push:
    paths:
      - '.github/instructions/*.instructions.md'
      - '.github/copilot-instructions.md'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run skills audit
        id: audit
        run: |
          python scripts/check_skills.py 2>&1 | tee audit_output.txt
          echo "output<<EOF" >> $GITHUB_OUTPUT
          cat audit_output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Check for prune warnings
        id: prune_check
        run: |
          if grep -q "prune needed" audit_output.txt; then
            echo "needs_pruning=true" >> $GITHUB_OUTPUT
            echo "PRUNE WARNING: Some skill files exceed 400 lines"
            grep "prune needed" audit_output.txt
          else
            echo "needs_pruning=false" >> $GITHUB_OUTPUT
          fi

      - name: Create pruning issue (if needed)
        if: steps.prune_check.outputs.needs_pruning == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('audit_output.txt', 'utf8');
            const pruneLines = output.split('\n')
              .filter(l => l.includes('prune needed'))
              .join('\n');

            // Check if issue already open
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'skills-pruning',
              state: 'open'
            });

            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🔧 Skills pruning needed — instruction files too large',
                body: `## Skills Audit Alert\n\nMonthly audit detected oversized skill files:\n\n\`\`\`\n${pruneLines}\n\`\`\`\n\n### Action required\nRun \`python scripts/check_skills.py\` locally and trim the flagged files.\n\nGoal: each \`.instructions.md\` < 400 lines. Remove stale examples, condense repeated patterns.\n\n**Full audit output:**\n\`\`\`\n${output}\n\`\`\``,
                labels: ['skills-pruning', 'documentation']
              });
            }

      - name: Summary
        run: |
          echo "## Skills Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat audit_output.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
